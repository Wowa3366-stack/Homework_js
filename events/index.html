<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
       body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      #font-size-control{
         display: block;
         margin-top: 20px;
      }
      #name-input{
        margin-top: 20px;
      }
      #validation-input {
        border: 3px solid #bdbdbd;
      }

      #validation-input.valid {
        border-color: #4caf50;
      }

      #validation-input.invalid {
        border-color: #f44336;
      }
    </style>
  </head>

  <body>

    <form class="form_color">
      <p>Choose a color:</p>
      <label>
        <input type="radio" name="color" value="red" checked />
        Red
      </label>
      <label>
        <input type="radio" name="color" value="white" />
        White
      </label>
      <label>
        <input type="radio" name="color" value="green" />
        Green
      </label>
    </form>

    <input type="text" placeholder="Ваше ім'я?" id="name-input" />
    <h1>Привіт, <span id="name-output">незнайомець</span>!</h1>

    <input
      type="text"
      id="validation-input"
      data-length="6"
      placeholder="Введи 6 символів"
    />

    <input id="font-size-control" type="range" min="10" max="100" value="16" />
    <br />
    <span id="text">Абракадабра!</span>

    <script src="./script.js"></script>
  </body>
</html>
